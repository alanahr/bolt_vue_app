version: '3.8'

services:
  # Development environment with hot reload
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: vue-crud-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URI=backend
      - VITE_BACKEND_PORT=8000
      - VITE_BACKEND_WSURI=ws
    networks:
      - app-network
    depends_on:
      - backend-dev
    command: npm run dev
    restart: unless-stopped

  # Production build and serve
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue-crud-prod
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
      - VITE_BACKEND_URI=backend
      - VITE_BACKEND_PORT=8000
      - VITE_BACKEND_WSURI=ws
    networks:
      - app-network
    depends_on:
      - backend-prod
    restart: unless-stopped

  # Backend Development
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: vue-crud-backend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=8000
      - CORS_ORIGINS=http://localhost:5173,http://frontend-dev:5173
    networks:
      - app-network
    restart: unless-stopped

  # Backend Production
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vue-crud-backend-prod
    ports:
      - "8001:8000"
    environment:
      - NODE_ENV=production
      - PORT=8000
      - CORS_ORIGINS=https://localhost,http://frontend-prod:4173
    networks:
      - app-network
    restart: unless-stopped

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: vue-crud-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-prod
      - backend-prod
    networks:
      - app-network
    restart: unless-stopped

  # Cypress testing service
  cypress:
    build:
      context: ./frontend
      dockerfile: Dockerfile.cypress
    container_name: vue-crud-cypress
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CYPRESS_baseUrl=http://frontend-dev:5173
      - CYPRESS_VIDEO=true
      - CYPRESS_SCREENSHOTS=true
    networks:
      - app-network
    depends_on:
      - frontend-dev
      - backend-dev
    profiles:
      - testing
    command: npm run cypress:run

networks:
  app-network:
    driver: bridge

volumes:
  node_modules:
  cypress_cache:
version: '3.8'

services:
  # Development environment with hot reload
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: vue-crud-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URI=backend
      - VITE_BACKEND_PORT=8000
      - VITE_BACKEND_WSURI=ws
    networks:
      - app-network
    command: npm run dev
    restart: unless-stopped

  # Production build and serve
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: production
    container_name: vue-crud-prod
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
      - VITE_BACKEND_URI=backend
      - VITE_BACKEND_PORT=8000
      - VITE_BACKEND_WSURI=ws
    networks:
      - app-network
    restart: unless-stopped

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: vue-crud-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend-prod
    networks:
      - app-network
    restart: unless-stopped

  # Cypress testing service
  cypress:
    build:
      context: .
      dockerfile: Dockerfile.cypress
    container_name: vue-crud-cypress
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CYPRESS_baseUrl=http://frontend-dev:5173
      - CYPRESS_VIDEO=true
      - CYPRESS_SCREENSHOTS=true
    networks:
      - app-network
    depends_on:
      - frontend-dev
    profiles:
      - testing
    command: npm run cypress:run

  # Mock backend service (optional)
  backend:
    image: node:18-alpine
    container_name: vue-crud-backend
    ports:
      - "8000:8000"
    volumes:
      - ./mock-backend:/app
    working_dir: /app
    environment:
      - NODE_ENV=development
      - PORT=8000
    networks:
      - app-network
    command: node server.js
    profiles:
      - with-backend

networks:
  app-network:
    driver: bridge

volumes:
  node_modules:
  cypress_cache: